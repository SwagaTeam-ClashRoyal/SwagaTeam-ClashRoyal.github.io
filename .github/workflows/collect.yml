name: Collect clan data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      telegram_preview:
        description: "Send sample Telegram messages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect
        run: python -m collector
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PREVIEW: ${{ inputs.telegram_preview }}

      - name: Commit data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update clan data"
          git push
